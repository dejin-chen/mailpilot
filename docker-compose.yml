name: mailpilot

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a '$${REDIS_PASSWORD}' ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  migrate:
    image: mailpilot-app:${MAILPILOT_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "backend/scripts/migrate.py"]
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      LOG_JSON: "true"
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      REDIS_URL: ${DOCKER_REDIS_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      JWT_ISSUER: ${JWT_ISSUER:-mailpilot}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-mailpilot-api}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: mailpilot-app:${MAILPILOT_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-MailPilot}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8501"]}
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      AGENT_STORE_TIMEOUT_SECONDS: ${AGENT_STORE_TIMEOUT_SECONDS:-10}
      REDIS_URL: ${DOCKER_REDIS_URL}
      REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-2}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-mailpilot}
      LOGIN_RATE_LIMIT_ENABLED: ${LOGIN_RATE_LIMIT_ENABLED:-true}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      LOGIN_RATE_LIMIT_IP_ATTEMPTS: ${LOGIN_RATE_LIMIT_IP_ATTEMPTS:-20}
      LOGIN_RATE_LIMIT_ACCOUNT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ACCOUNT_ATTEMPTS:-5}
      WRITE_LOCK_TTL_SECONDS: ${WRITE_LOCK_TTL_SECONDS:-30}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      JWT_ISSUER: ${JWT_ISSUER:-mailpilot}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-mailpilot-api}
      MCP_INTERNAL_TOKEN: ${MCP_INTERNAL_TOKEN}
      MAIL_MCP_URL: ${MAIL_MCP_URL:-http://mail-mcp:8001/mcp}
      CALENDAR_MCP_URL: ${CALENDAR_MCP_URL:-http://calendar-mcp:8002/mcp}
      MCP_TIMEOUT_SECONDS: ${MCP_TIMEOUT_SECONDS:-10}
      MCP_MAX_RETRIES: ${MCP_MAX_RETRIES:-1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_STRUCTURED_OUTPUT_METHOD: ${LLM_STRUCTURED_OUTPUT_METHOD:-function_calling}
      AGENT_ANALYSIS_MODE: ${AGENT_ANALYSIS_MODE:-optimized}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_CAPTURE_CONTENT: ${LANGFUSE_CAPTURE_CONTENT:-false}
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: mailpilot-app:${MAILPILOT_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - streamlit
      - run
      - frontend/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    environment:
      PYTHONPATH: /app
      MAILPILOT_API_URL: ${DOCKER_MAILPILOT_API_URL:-http://backend:8000/api/v1}
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8501}:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mail-mcp:
    image: mailpilot-app:${MAILPILOT_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - uvicorn
      - mcp_servers.mail.server:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      REDIS_URL: ${DOCKER_REDIS_URL}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-mailpilot}
      WRITE_LOCK_TTL_SECONDS: ${WRITE_LOCK_TTL_SECONDS:-30}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ISSUER: ${JWT_ISSUER:-mailpilot}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-mailpilot-api}
      MCP_INTERNAL_TOKEN: ${MCP_INTERNAL_TOKEN}
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:${MAIL_MCP_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  calendar-mcp:
    image: mailpilot-app:${MAILPILOT_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - uvicorn
      - mcp_servers.calendar.server:app
      - --host
      - 0.0.0.0
      - --port
      - "8002"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      REDIS_URL: ${DOCKER_REDIS_URL}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-mailpilot}
      WRITE_LOCK_TTL_SECONDS: ${WRITE_LOCK_TTL_SECONDS:-30}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ISSUER: ${JWT_ISSUER:-mailpilot}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-mailpilot-api}
      MCP_INTERNAL_TOKEN: ${MCP_INTERNAL_TOKEN}
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:${CALENDAR_MCP_PORT:-8002}:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:1.30.4-alpine
    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q mailpilot-gateway-ok"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
