user nginx;
worker_processes auto;
error_log /dev/stderr notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format mailpilot '$remote_addr - $request_id [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         'upstream=$upstream_addr upstream_time=$upstream_response_time';
    access_log /dev/stdout mailpilot;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 5m;

    # Docker 容器重建后 IP 会变化；使用 Docker 内置 DNS 动态刷新 upstream。
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream mailpilot_backend {
        zone mailpilot_backend 64k;
        server backend:8000 resolve;
        keepalive 16;
    }

    upstream mailpilot_frontend {
        zone mailpilot_frontend 64k;
        server frontend:8501 resolve;
        keepalive 8;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "mailpilot-gateway-ok\n";
        }

        # MCP 只允许后端通过 Docker 内部网络访问，不向浏览器暴露。
        location ~ ^/(mcp|mail-mcp|calendar-mcp)(/|$) {
            return 404;
        }

        # SSE 需要立即把每个事件传给浏览器，不能等 Nginx 缓冲区攒满。
        location ^~ /api/ {
            proxy_pass http://mailpilot_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 60s;
        }

        location = /openapi.json {
            proxy_pass http://mailpilot_backend/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location ~ ^/(docs|redoc)(/|$) {
            proxy_pass http://mailpilot_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Streamlit 页面和 /_stcore/stream WebSocket 共用这一入口。
        location / {
            proxy_pass http://mailpilot_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 60s;
        }
    }
}
