[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mailpilot"
version = "0.1.0"
description = "企业邮件与日程协同 Agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18,<2",
    "email-validator>=2.3,<3",
    "fastapi>=0.139,<0.140",
    "httpx>=0.28,<0.29",
    "langchain-mcp-adapters>=0.3,<0.4",
    "langchain-openai>=1.3.5,<1.4",
    "langfuse>=4.14.1,<5",
    "langgraph>=1.2.9,<1.3",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "mcp[cli]>=1.27.2,<2",
    "psycopg[binary,pool]>=3.3,<4",
    "pydantic-settings>=2.12,<3",
    "pwdlib[argon2]>=0.3,<1",
    "pyjwt>=2.13,<3",
    "redis>=8,<9",
    "sqlalchemy>=2.0.51,<2.1",
    "streamlit>=1.59.2,<1.60",
    "uvicorn[standard]>=0.41,<0.42",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.15,<0.16",
]
eval = [
    "deepeval>=4.1.4,<5",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-config --strict-markers"
markers = [
    "integration: 需要真实 PostgreSQL 等基础设施的集成测试",
    "model_eval: 需要显式配置真实模型、不会随普通 pytest 自动运行的评测",
]

[tool.coverage.run]
branch = true
source = ["backend/app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
